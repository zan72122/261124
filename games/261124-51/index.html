<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9cc9f0">
<title>3つのおうちづくり</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc9f0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;top:0;width:84px;height:84px;margin:-10px 0 0 -26px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3}
#hint.on{opacity:.95}
#hint svg{width:100%;height:100%;animation:tap 1.1s ease-in-out infinite;transform-origin:30% 10%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
@keyframes tap{0%,100%{transform:translate(0,14px) scale(1)}45%{transform:translate(0,0) scale(.92)}}
#again{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);display:none;z-index:4;cursor:pointer}
#again.on{display:block;animation:pop .5s}
#again:active{transform:scale(.92)}
#again svg{width:62px;height:62px;margin-top:3px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9cc9f0;z-index:5;transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}
#load div{width:90px;height:90px;border-radius:50%;border:10px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#hint svg,#load div{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><svg viewBox="0 0 64 64"><path d="M22 6c3 0 5 2 5 5v17l3-1c2-1 5 0 5 3l3-1c2-1 5 0 5 3l2-.5c3-1 6 1 6 4v12c0 8-6 14-14 14h-5c-5 0-8-2-11-6L9 40c-2-2-1-5 1-6s4-1 6 1l1 1V11c0-3 2-5 5-5z" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/></svg></div>
<button id="again" aria-label="もういちど"><svg viewBox="0 0 64 64"><rect x="6" y="38" width="14" height="14" rx="2" fill="#c49a64"/><rect x="25" y="34" width="14" height="18" rx="7" fill="#ff9cc0"/><rect x="44" y="40" width="7" height="12" fill="#e53935"/><rect x="51" y="40" width="7" height="12" fill="#1e88e5"/><rect x="44" y="30" width="14" height="10" fill="#fdd835"/><path d="M14 26a18 18 0 0 1 34-6" fill="none" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/><path d="M50 10l-1 12-11-4z" fill="#4caf50"/></svg></button>
<div id="load"><div></div></div>
<script type="module" src="game.js"></script>
<script src="/gf-playlog.js" defer></script>
</body>
</html>
