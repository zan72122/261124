<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e6d3">
<title>レストランとホテルのてんいんさん</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3e6d3; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 1; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f3e6d3; transition: opacity .5s; pointer-events: none; }
  #loading svg { width: 120px; height: 120px; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #again { display: none; position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    width: 64px; height: 64px; border-radius: 50%; border: none; background: rgba(255,255,255,.85); box-shadow: 0 4px 0 rgba(0,0,0,.15); padding: 12px; }
  #again:active { transform: scale(.92); }
  #rotate { display: none; position: fixed; left: 50%; top: 18px; transform: translateX(-50%); width: 96px; height: 96px; border-radius: 24px;
    background: rgba(255,255,255,.85); pointer-events: none; padding: 12px; box-sizing: border-box; }
  #rotate svg { animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 600px) { #rotate { display: block; } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade" style="opacity:1"></div>
<div id="loading"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff" stroke="#e5d6bf" stroke-width="4"/><circle cx="50" cy="50" r="26" fill="none" stroke="#e5d6bf" stroke-width="3"/><circle cx="50" cy="10" r="8" fill="#d9ab4f"/></svg></div>
<button id="again" aria-label="もういちど" onclick="location.reload()"><svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 0 16 16" fill="none" stroke="#e0789a" stroke-width="6" stroke-linecap="round"/><path d="M24 0l10 8-10 8z" fill="#e0789a"/></svg></button>
<div id="rotate"><svg viewBox="0 0 72 72"><rect x="22" y="8" width="28" height="56" rx="6" fill="#fff" stroke="#888" stroke-width="4"/><circle cx="36" cy="56" r="3" fill="#888"/></svg></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
