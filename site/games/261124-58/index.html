<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e6d2">
<title>ふしぎな きょうしつ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3e6d2; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 1; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,255,255,0.0) 30%, rgba(255,240,220,0.55)); }
  #play { width: 34vmin; height: 34vmin; max-width: 220px; max-height: 220px; border-radius: 50%; border: none; background: #ff6f9f; box-shadow: 0 1.4vmin 0 #d94c7c, 0 3vmin 6vmin rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; animation: bob 1.6s ease-in-out infinite; cursor: pointer; padding: 0; }
  #play:active { transform: translateY(1vmin); box-shadow: 0 0.4vmin 0 #d94c7c; }
  #play svg { width: 50%; height: 50%; margin-left: 8%; }
  @keyframes bob { 50% { transform: translateY(-1.6vmin) scale(1.04); } }
  #hint { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #hint .ring { position: absolute; left: -42px; top: -42px; width: 84px; height: 84px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.95); box-shadow: 0 0 18px rgba(255,200,80,0.9), inset 0 0 12px rgba(255,200,80,0.6); animation: pulse 1s ease-in-out infinite; box-sizing: border-box; }
  #hint .dot { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  @keyframes pulse { 0%,100% { transform: scale(0.8); opacity: .9; } 50% { transform: scale(1.15); opacity: .5; } }
  #again { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: 64px; height: 64px; border-radius: 50%; border: none; background: rgba(255,255,255,0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; padding: 0; }
  #again svg { width: 60%; height: 60%; }
</style>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<div id="app"></div>
<div id="hint"><div class="ring"></div><div class="dot"></div></div>
<div id="fade"></div>
<div id="start"><button id="play" aria-label="play"><svg viewBox="0 0 10 10"><path d="M2 1.2 L8.6 5 L2 8.8 Z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg></button></div>
<button id="again" aria-label="again"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8" fill="none" stroke="#ff6f9f" stroke-width="3" stroke-linecap="round"/><path d="M12 0.5 L17 4 L12 7.5 Z" fill="#ff6f9f"/></svg></button>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="./js/main.js"></script>
<script src="/gf-playlog.js" defer></script>
</body>
</html>
